server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ems-admin
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://47.106.152.37:3306/ems_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:renon}
    password: ${MYSQL_PASSWORD:renon}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ems:
  jwt:
    # 生产环境必须用环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:ems-admin-dev-jwt-secret-change-me-32b}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  tdengine:
    url: ${TD_URL:jdbc:TAOS-RS://120.79.70.60:6041/cloud_db}
    username: ${TD_USERNAME:root}
    password: ${TD_PASSWORD:Jx5rUd0OFHt8ziop}
    database: ${TD_DATABASE:cloud_db}
    connection-timeout-ms: ${TD_CONNECTION_TIMEOUT_MS:3000}
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-hongkong.aliyuncs.com}
    public-endpoint: ${OSS_PUBLIC_ENDPOINT:https://dev-oss-rn.renoncloudx.com}
    bucket: ${OSS_BUCKET:dev-renon-power}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    upload-expire-minutes: ${OSS_UPLOAD_EXPIRE_MINUTES:10}
    read-expire-minutes: ${OSS_READ_EXPIRE_MINUTES:120}
  price:
    sync-enabled: ${PRICE_SYNC_ENABLED:true}
    entsoe-security-token: ${ENTSOE_SECURITY_TOKEN:}
    entsoe-endpoint: ${ENTSOE_ENDPOINT:https://web-api.tp.entsoe.eu/api}
