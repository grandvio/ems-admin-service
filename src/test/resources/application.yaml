spring:
  datasource:
    url: jdbc:h2:mem:ems;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/V1__init.sql
        - classpath:db/migration/V2__oss.sql
        - classpath:db/migration/V3__energy.sql
        - classpath:db/migration/V4__energy_source.sql
        - classpath:db/migration/V5__tariff.sql
        - classpath:db/migration/V6__realtime_price.sql

ems:
  jwt:
    secret: ems-admin-dev-jwt-secret-change-me-32b
    expire-minutes: 720
  tdengine:
    url: jdbc:TAOS-RS://127.0.0.1:1/cloud_db
    username: root
    password: ""
    database: cloud_db
    connection-timeout-ms: 300
  oss:
    endpoint: https://oss-cn-hongkong.aliyuncs.com
    public-endpoint: https://oss.example.com
    bucket: test-bucket
    access-key-id: testAccessKeyId
    access-key-secret: testAccessKeySecret
    upload-expire-minutes: 10
    read-expire-minutes: 120
  energy:
    rollup-delay-ms: 3600000
    rollup-initial-delay-ms: 3600000
  price:
    sync-enabled: false
    entsoe-security-token: ""
    entsoe-endpoint: https://entsoe.example/api
